# Render blueprint for the Guest House Booking System.
# Docs: https://render.com/docs/blueprint-spec
#
# Fully free: a Docker web service + Render's managed PostgreSQL (free tier).
# The DB_* variables are wired automatically from the database below, so there
# is nothing to paste except APP_KEY and APP_URL.

databases:
  - name: guesthouse-db
    plan: free
    databaseName: guesthouse
    user: guesthouse

services:
  - type: web
    name: guesthouse
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: "Guest House Booking System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate once locally with:  php artisan key:generate --show
      # then paste the base64:... value in the Render dashboard.
      - key: APP_KEY
        sync: false
      # After the first deploy, set this to your Render URL,
      # e.g. https://guesthouse.onrender.com
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error

      # --- Database: Render managed PostgreSQL, wired automatically ---
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: guesthouse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: guesthouse-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: guesthouse-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: guesthouse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: guesthouse-db
          property: password

      # --- Sessions / cache / queue live in the database (no Redis needed) ---
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # --- Mail: log driver so nothing tries to send during a demo ---
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: "guesthouse@nadt.gov.in"

      # --- Notifications ---
      - key: NOTIFY_EMAIL_ENABLED
        value: "false"
      - key: NOTIFY_SMS_ENABLED
        value: "false"
      - key: NOTIFY_INAPP_ENABLED
        value: "true"

      # --- Institution details ---
      - key: GH_INSTITUTION
        value: "NADT, RC, DTRTI"
      - key: GH_BUILDING
        value: "Pragya Bhawan"
      - key: GH_CITY
        value: "Lucknow, Uttar Pradesh"
      - key: GH_PIN
        value: "226002"

      # Set to "true" for the FIRST deploy only (runs migrate --seed to create
      # roles, demo users, rooms), then change to "false" and redeploy.
      - key: SEED
        value: "true"
